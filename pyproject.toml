[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyureq"
version = "0.1.0"
description = "A requests-compatible HTTP library powered by Rust's ureq crate"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "pyureq._pyureq"
